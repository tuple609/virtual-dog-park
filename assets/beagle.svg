<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <title>Illustration of a Beagle</title>
  <!-- ears -->
  <ellipse cx="54" cy="108" rx="25" ry="45" fill="#7d5236"/>
  <ellipse cx="146" cy="108" rx="25" ry="45" fill="#7d5236"/>
  <!-- head -->
  <ellipse cx="100" cy="100" rx="53" ry="51" fill="#c78d5c"/>
  <!-- white blaze down the face -->
  <path d="M100 52c12 16 16 38 12 56-3 14-7 22-12 26-5-4-9-12-12-26-4-18 0-40 12-56z" fill="#f7e9d8"/>
  <!-- muzzle -->
  <ellipse cx="100" cy="132" rx="32" ry="25" fill="#f7e9d8"/>
  <!-- nose -->
  <ellipse cx="100" cy="119" rx="12" ry="9" fill="#3a2a21"/>
  <ellipse cx="96" cy="116" rx="3.5" ry="2.5" fill="#6b5850"/>
  <!-- eyes -->
  <circle cx="77" cy="93" r="7.5" fill="#3a2a21"/>
  <circle cx="123" cy="93" r="7.5" fill="#3a2a21"/>
  <circle cx="79.5" cy="90.5" r="2.6" fill="#ffffff"/>
  <circle cx="125.5" cy="90.5" r="2.6" fill="#ffffff"/>
  <!-- mouth and tongue -->
  <path d="M100 128v6M100 134c-4 6-11 6-15 0M100 134c4 6 11 6 15 0" stroke="#3a2a21" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M93 141h14a3 3 0 0 1 3 3v6a10 10 0 0 1-20 0v-6a3 3 0 0 1 3-3z" fill="#e8859d"/>
</svg>
